<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不可取代，是一種失敗 — 我的標準化人生</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="theme">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

    <style>
        /* 繁體中文字型：標題用 Noto Serif TC（沉穩），內文用 Noto Sans TC（乾淨） */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap');

        :root {
            --accent: #d9b08c;      /* 暖金，給回扣那句信仰用 */
            --muted: #8a8a8a;
        }

        .reveal {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        .reveal h1, .reveal h2, .reveal h3 {
            font-family: 'Noto Serif TC', serif;
            font-weight: 900;
            text-transform: none;
            letter-spacing: 0.03em;
            line-height: 1.25;
        }
        .reveal h1 { font-size: 2.1em; }
        .reveal h2 { font-size: 1.5em; }
        .reveal section p { line-height: 1.5; }

        /* 關鍵信仰句：暖金、襯線、置中 */
        .reveal .creed {
            font-family: 'Noto Serif TC', serif;
            font-weight: 900;
            color: var(--accent);
            font-size: 1.55em;
            line-height: 1.45;
        }
        .reveal .sub { color: var(--muted); font-size: 0.7em; font-weight: 300; }
        .reveal .tag {
            color: var(--accent);
            font-size: 0.5em;
            letter-spacing: 0.35em;
            font-weight: 500;
            margin-bottom: 0.6em;
        }
        .reveal em { color: var(--accent); font-style: normal; }
        .reveal code { font-family: 'JetBrains Mono', 'Menlo', monospace; }
        .reveal .small { font-size: 0.6em; color: var(--muted); }
        .reveal .refs { font-size: 0.5em; text-align: left; line-height: 2.1; display: inline-block; }

        /* 章節分隔頁 */
        .reveal section.belief h2 { color: #fff; }
        .reveal section.belief .tag { display: block; }

        /* 左下角段名 + 段內進度 */
        #section-marker {
            position: fixed;
            bottom: 18px;
            left: 24px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--accent);
            opacity: 0.7;
            z-index: 40;
            pointer-events: none;
            transition: opacity 0.4s;
        }
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <section
                data-markdown="slides.md"
                data-separator="^\r?\n---\r?\n$"
                data-separator-vertical="^\r?\n----\r?\n$"
                data-separator-notes="^Note:">
            </section>
        </div>
        <div id="section-marker"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script>
        // 段名（依水平 section 索引；封面留空）
        const SECTION_NAMES = ['', '開場', '信念一 · 公開透明', '信念二 · 不可取代', '信念三 · 我可能錯了', '這也會過去', '收尾', '參考'];
        function updateMarker() {
            const idx = Reveal.getIndices();
            const name = SECTION_NAMES[idx.h] || '';
            const sections = document.querySelectorAll('.reveal .slides > section');
            const cur = sections[idx.h];
            const verticals = cur ? cur.querySelectorAll(':scope > section') : [];
            const el = document.getElementById('section-marker');
            let text = name;
            if (verticals.length > 1) text += '　·　' + (idx.v + 1) + '/' + verticals.length;
            el.textContent = text;
            el.style.opacity = name ? '0.7' : '0';
        }

        Reveal.initialize({
            hash: true,
            slideNumber: 'c/t',
            transition: 'fade',
            transitionSpeed: 'slow',
            center: true,
            plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
        }).then(updateMarker);
        Reveal.on('slidechanged', updateMarker);
    </script>
</body>
</html>
